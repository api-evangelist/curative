aid: curative
name: Curative
description: >-
  Curative is a health insurance and healthcare services company founded in 2020
  that reengineered the employer-based health plan around simplicity, engagement,
  and cost transparency. Its fully insured and level-funded plans give members a
  competitive monthly premium with zero copays, deductibles, or out-of-pocket costs,
  starting each member with a baseline visit that tailors a preventative care plan.
  Curative serves more than 1,200 employer clients and over 165,000 members, reached
  profitability, and achieved unicorn status ($1.275B valuation) following a $150M
  Series B round backed by DCVC. Curative operates as a HIPAA-regulated health plan;
  it has no public developer/API program, so this API Evangelist profile captures
  company identity, its member/provider web surface, and probed domain-security posture
  rather than API artifacts.
